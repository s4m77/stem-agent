[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stemds"
version = "0.1.0"
description = "A constrained stem-agent framework for data-science task specialization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "openai",
  "pandas",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["stemds*"]

